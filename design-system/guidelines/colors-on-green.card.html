<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--foreground);background:#fff;padding:16px}.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}</style></head><body><div style="background:var(--primary);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:8px">
<div style="color:var(--on-green-primary);font:900 18px/1.2 var(--font-sans);text-transform:uppercase;letter-spacing:.04em">100% — Titles &amp; wordmark</div>
<div style="color:var(--on-green-secondary);font:700 12px/1.2 var(--font-sans);text-transform:uppercase;letter-spacing:.1em">80% — Field labels &amp; nav links</div>
<div style="color:var(--on-green-tertiary);font:400 12px/1.4 var(--font-sans);text-transform:uppercase;letter-spacing:.2em">60% — Eyebrows &amp; captions</div>
<div style="color:var(--on-green-faint);font:400 10px/1.4 var(--font-sans);text-transform:uppercase;letter-spacing:.1em">30% — Legal links</div>
<div style="color:var(--accent);font:900 12px/1.2 var(--font-sans);text-transform:uppercase;letter-spacing:.1em">Accent — links &amp; the primary action</div>
</div></body></html>
