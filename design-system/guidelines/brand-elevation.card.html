<!-- @dsCard group="Brand" viewport="700x170" name="Borders & Shadows" subtitle="Hairline borders do the work; the only real shadow is under a sign card" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--foreground);background:#fff;padding:16px}.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}</style></head><body><div style="display:flex;gap:20px;align-items:center;padding:8px">
<div style="width:150px;height:88px;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;color:var(--muted-foreground)">1px border<br>no shadow<br>(all cards)</div>
<div style="width:150px;height:88px;border-radius:8px;box-shadow:var(--shadow-sign);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;color:var(--muted-foreground)">--shadow-sign<br>0 8px 32px green 25%</div>
<div style="width:150px;height:88px;border:3px solid #000;border-radius:12px;background:#fff;padding:6px;box-sizing:border-box"><div style="background:var(--primary);border-radius:8px;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;text-align:center">3px black keyline<br>6px white frame</div></div>
<div style="width:150px;height:88px;border:1px solid var(--primary);border-radius:4px;box-shadow:var(--focus-ring);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted-foreground)">--focus-ring</div>
</div></body></html>
