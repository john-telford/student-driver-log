<!-- @dsCard group="Brand" viewport="700x140" name="Iconography" subtitle="Two hand-cut 2.5px stroke glyphs, plus → and ✓ as type" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--foreground);background:#fff;padding:16px}.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}</style></head><body><div style="display:flex;gap:30px;align-items:center">
<div style="text-align:center"><img src="../assets/icon-menu.svg" width="28" height="28" alt="Menu" style="color:var(--primary)"><div class="mono" style="margin-top:6px">icon-menu</div></div>
<div style="text-align:center"><img src="../assets/icon-close.svg" width="28" height="28" alt="Close" style="color:var(--primary)"><div class="mono" style="margin-top:6px">icon-close</div></div>
<div style="text-align:center"><span style="color:var(--accent);font:900 26px/1 var(--font-sans)">→</span><div class="mono" style="margin-top:6px">list bullet</div></div>
<div style="text-align:center"><span style="color:var(--primary);font:400 26px/1 var(--font-sans)">✓</span><div class="mono" style="margin-top:6px">success mark</div></div>
<div style="text-align:center"><span style="font:400 20px/1 var(--font-sans);color:var(--muted-foreground)">—</span><div class="mono" style="margin-top:6px">zero value</div></div>
<div style="font-size:11px;color:var(--muted-foreground);max-width:190px">No icon library, no icon font, no emoji. Anything new is drawn at 24px on a 2.5px round-cap stroke.</div>
</div></body></html>
