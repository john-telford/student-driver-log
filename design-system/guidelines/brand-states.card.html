<!-- @dsCard group="Brand" viewport="700x160" name="Interaction States" subtitle="Filled fills dim to 90%; outlines take a muted fill; links underline" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--foreground);background:#fff;padding:16px}.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:14px"><span class="lbl" style="width:74px">Default</span>
<button style="border:0;background:var(--accent);color:var(--accent-foreground);font:900 12px/1.2 var(--font-sans);text-transform:uppercase;letter-spacing:.1em;padding:4px 12px;border-radius:4px">+ Log Trip</button>
<button style="background:transparent;border:1px solid var(--border);color:var(--foreground);font:700 14px/1.2 var(--font-sans);text-transform:uppercase;letter-spacing:.1em;padding:10px 16px;border-radius:4px">Cancel</button>
<span style="font:700 12px/1.2 var(--font-sans);color:var(--primary);text-transform:uppercase;letter-spacing:.1em">View All</span></div>
<div style="display:flex;align-items:center;gap:14px"><span class="lbl" style="width:74px">Hover</span>
<button style="border:0;background:var(--accent);opacity:.9;color:var(--accent-foreground);font:900 12px/1.2 var(--font-sans);text-transform:uppercase;letter-spacing:.1em;padding:4px 12px;border-radius:4px">+ Log Trip</button>
<button style="background:var(--muted);border:1px solid var(--border);color:var(--foreground);font:700 14px/1.2 var(--font-sans);text-transform:uppercase;letter-spacing:.1em;padding:10px 16px;border-radius:4px">Cancel</button>
<span style="font:700 12px/1.2 var(--font-sans);color:var(--primary);text-transform:uppercase;letter-spacing:.1em;text-decoration:underline">View All</span></div>
<div style="display:flex;align-items:center;gap:14px"><span class="lbl" style="width:74px">Disabled</span>
<button style="border:0;background:var(--primary);opacity:.5;color:#fff;font:700 14px/1.2 var(--font-sans);text-transform:uppercase;letter-spacing:.1em;padding:10px 16px;border-radius:4px">Saving…</button>
<span class="mono">opacity .5 · no colour change</span></div>
</div></body></html>
