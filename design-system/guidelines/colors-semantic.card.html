<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — Destructive" subtitle="Traffic-sign red is the only alert colour; there is no info or warning hue" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);color:var(--foreground);background:#fff;padding:16px}.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-foreground)}.mono{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}</style></head><body><div style="display:flex;gap:20px;align-items:center">
<div style="width:180px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:60px;border-radius:4px;background:var(--destructive);border:1px solid var(--border)"></div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">Destructive</div><div class="mono">--destructive · oklch(0.55 0.22 25)</div></div></div>
<div style="display:flex;flex-direction:column;gap:10px">
<button style="border:0;background:var(--destructive);color:#fff;font:700 14px/1.2 var(--font-sans);text-transform:uppercase;letter-spacing:.1em;padding:10px 16px;border-radius:4px">Delete</button>
<span style="font-size:12px;color:var(--destructive);font-weight:700;text-transform:uppercase;letter-spacing:.1em">Delete</span>
<span style="font-size:12px;color:var(--destructive);font-weight:500">Daytime or nighttime minutes are required.</span>
</div>
<div style="border:2px solid color-mix(in oklab, var(--destructive) 40%, transparent);border-radius:8px;padding:12px;max-width:220px"><div style="font:900 14px/1.2 var(--font-sans);text-transform:uppercase;letter-spacing:.04em;color:var(--destructive)">Danger Zone</div><div style="font-size:12px;color:var(--muted-foreground);margin-top:4px">Destructive sections get a 2px 40%-red border.</div></div>
</div></body></html>
